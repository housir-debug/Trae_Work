<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FF6B6B">
<title>🍅 番茄Todo - 专注助手</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="番茄Todo">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ============ 基础重置 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;color:#2D2D2D;}
body{display:flex;flex-direction:column;background:#1a1a2e;}

/* ============ 主题 ============ */
:root{
  --primary:#FF6B6B;--accent:#FF8E53;
  --bg1:#FFF5F5;--bg2:#FFE0E0;--bg:#FF6B6B;
  --card:rgba(255,255,255,.9);
  --fg:#2D2D2D;--fg60:rgba(45,45,45,.6);--fg40:rgba(45,45,45,.4);
}

/* 内置主题 */
.theme-mint{--primary:#6BCB9D;--accent:#4ECDC4;}
.theme-ocean{--primary:#4A90E2;--accent:#90CAF9;}
.theme-sun{--primary:#FFA726;--accent:#FF7043;}
.theme-lavender{--primary:#9575CD;--accent:#D1C4E9;}
.theme-dark{--primary:#81D4FA;--accent:#4FC3F7;--bg1:#121212;--bg2:#1E1E1E;--card:rgba(30,30,30,.92);--fg:#E0E0E0;--fg60:rgba(224,224,224,.6);--fg40:rgba(224,224,224,.4);}
.theme-cyber{--primary:#FF00FF;--accent:#00FFFF;--bg1:#0A0A1A;--bg2:#151530;--card:rgba(21,21,48,.92);--fg:#E0FFFF;--fg60:rgba(224,255,255,.6);--fg40:rgba(224,255,255,.4);}
.theme-ink{--primary:#5D6D7E;--accent:#85929E;--bg1:#FAFAF5;--bg2:#E8E8E0;}

/* ============ 背景层 ============ */
#bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,var(--bg1),var(--bg2));}
#bg-overlay{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.5);transition:background .3s;pointer-events:none;}
body[data-bg="img"] #bg{background:no-repeat center/cover;}
body[data-bg="img"] #bg-inner{position:fixed;inset:0;background:var(--bg-img);z-index:-2;background-size:cover;background-position:center;}
body[data-bg="grad"] #bg{background:linear-gradient(135deg,var(--grad1),var(--grad2));}

/* ============ 顶部导航 ============ */
header{padding:env(safe-area-inset-top) 16px 8px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:20px;font-weight:700;color:var(--fg);}
header .today-stat{display:flex;gap:14px;font-size:12px;color:var(--fg60);}
header .today-stat b{color:var(--primary);font-size:16px;font-weight:700;margin-right:3px;}

/* ============ 内容区 ============ */
main{flex:1;overflow-y:auto;padding:8px 16px 90px;-webkit-overflow-scrolling:touch;}
main::-webkit-scrollbar{display:none;}

/* ============ 番茄钟 ============ */
.timer-card{background:var(--card);border-radius:24px;padding:32px 16px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);}
.tabs{display:flex;background:rgba(0,0,0,.06);border-radius:24px;padding:4px;width:max-content;margin:0 auto 24px;}
.tabs button{border:none;background:transparent;padding:8px 18px;border-radius:20px;font-size:14px;color:var(--fg60);cursor:pointer;transition:all .2s;font-family:inherit;}
.tabs button.active{background:var(--primary);color:#fff;font-weight:600;}

.timer-wrap{position:relative;width:260px;height:260px;margin:0 auto;}
.timer-wrap svg{transform:rotate(-90deg);}
.timer-wrap circle{transition:stroke-dashoffset .5s linear;}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-time{font-size:56px;font-weight:200;letter-spacing:2px;color:var(--fg);}
.timer-label{font-size:13px;letter-spacing:4px;color:var(--fg40);margin-top:4px;}

.ctrl-row{display:flex;justify-content:center;gap:12px;margin-top:28px;}
.ctrl-btn{border:none;padding:14px 28px;border-radius:28px;font-size:16px;font-family:inherit;cursor:pointer;transition:transform .15s,opacity .15s;}
.ctrl-btn:active{transform:scale(.95);}
.ctrl-btn.primary{background:var(--primary);color:#fff;min-width:140px;font-weight:600;}
.ctrl-btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--fg40);}
.ctrl-btn.sm{padding:8px 18px;font-size:14px;border-radius:20px;}

/* ============ 任务 ============ */
.section-title{display:flex;align-items:center;gap:8px;padding:16px 4px 10px;font-size:15px;font-weight:600;color:var(--fg);}
.section-title .tab-group{display:flex;gap:8px;margin-left:auto;}
.section-title .tab-group button{border:none;background:transparent;color:var(--fg60);font-size:13px;padding:4px 10px;border-radius:12px;font-family:inherit;cursor:pointer;}
.section-title .tab-group button.active{background:var(--primary);color:#fff;font-weight:600;}

.task-input{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.task-input input[type="text"]{width:100%;border:none;outline:none;background:transparent;font-size:15px;color:var(--fg);font-family:inherit;padding:6px 8px;}
.task-input .row{display:flex;align-items:center;gap:6px;margin-top:8px;}
.task-input .chip{padding:4px 12px;border-radius:14px;font-size:12px;cursor:pointer;border:1.5px solid transparent;}
.task-input .chip[data-p="high"]{color:#FF6B6B;border-color:#FF6B6B;}
.task-input .chip[data-p="medium"]{color:#FFA726;border-color:#FFA726;}
.task-input .chip[data-p="low"]{color:#9E9E9E;border-color:#9E9E9E;}
.task-input .chip.sel{background:currentColor;color:#fff;}
.task-input .add-btn{margin-left:auto;background:var(--primary);color:#fff;border:none;padding:8px 18px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;}

.task-item{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:border-color .2s;}
.task-item.selected{border:2px solid var(--primary);}
.task-item .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg40);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;transition:all .2s;}
.task-item .check.done{background:var(--primary);border-color:var(--primary);color:#fff;}
.task-item .content{flex:1;min-width:0;}
.task-item .title{font-size:15px;color:var(--fg);word-break:break-all;}
.task-item.done .title{text-decoration:line-through;color:var(--fg40);}
.task-item .meta{display:flex;gap:8px;margin-top:4px;font-size:11px;}
.task-item .pri{padding:1px 7px;border-radius:8px;}
.task-item .pri.high{background:rgba(255,107,107,.15);color:#FF6B6B;}
.task-item .pri.medium{background:rgba(255,167,38,.15);color:#FFA726;}
.task-item .pri.low{background:rgba(158,158,158,.15);color:#9E9E9E;}
.task-item .pomo{color:var(--fg60);}
.task-item .act button{background:transparent;border:none;color:var(--fg40);font-size:18px;cursor:pointer;padding:2px 6px;}
.task-item .act button.sel{color:var(--primary);}

.empty-hint{text-align:center;color:var(--fg40);font-size:13px;padding:20px;}

/* ============ 统计 ============ */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
.stat-card{background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.stat-card .label{font-size:11px;color:var(--fg60);margin-bottom:4px;}
.stat-card .value{font-size:22px;font-weight:700;color:var(--primary);}
.stat-card .unit{font-size:10px;color:var(--fg40);}

.chart-card{background:var(--card);border-radius:20px;padding:16px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.chart-card h3{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:12px;}

/* 柱状图 */
.bar-chart{height:160px;display:flex;align-items:flex-end;gap:8px;padding:0 4px;}
.bar-chart .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-chart .bar{width:100%;border-radius:6px 6px 0 0;background:var(--primary);min-height:4px;transition:height .5s;}
.bar-chart .lbl{font-size:10px;color:var(--fg60);}

/* 饼图(简化 SVG) */
.pie-wrap{display:flex;align-items:center;gap:16px;}
.pie-wrap svg{flex-shrink:0;}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12px;}
.legend .lg{display:flex;align-items:center;gap:6px;color:var(--fg60);}
.legend .dot{width:10px;height:10px;border-radius:2px;}

/* 热力图 */
.heatmap{display:flex;gap:4px;margin-top:8px;}
.heatmap .col{display:flex;flex-direction:column;gap:2px;}
.heatmap .cell{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.15);cursor:pointer;transition:background .2s;}
.heatmap .cell.l1{background:rgba(0,0,0,.15);}
.heatmap .cell.l2{background:rgba(255,107,107,.3);}
.heatmap .cell.l3{background:rgba(255,107,107,.55);}
.heatmap .cell.l4{background:rgba(255,107,107,.8);}
.heatmap .cell.l5{background:rgba(255,107,107,1);}
.heatmap .dow{font-size:9px;color:var(--fg40);text-align:center;}

/* ============ 设置 ============ */
.section{margin-top:16px;}
.section h2{font-size:14px;font-weight:600;color:var(--fg60);padding:4px 4px 10px;}
.theme-grid{background:var(--card);border-radius:18px;padding:14px;margin:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.theme-item{cursor:pointer;text-align:center;}
.theme-item .swatch{width:100%;aspect-ratio:1.6;border-radius:12px;background:linear-gradient(135deg,var(--tp),var(--ta));margin-bottom:6px;border:3px solid transparent;transition:border-color .2s;}
.theme-item.sel .swatch{border-color:var(--fg);}
.theme-item .name{font-size:11px;color:var(--fg);}

.grad-grid{background:var(--card);border-radius:18px;padding:14px;margin:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.grad-item{aspect-ratio:1;cursor:pointer;border-radius:10px;border:3px solid transparent;transition:border-color .2s;}
.grad-item.sel{border-color:var(--fg);}

.setting-row{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 16px 1px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.setting-row label{color:var(--fg);font-size:14px;}
.setting-row .val{color:var(--fg60);font-size:13px;}
.setting-row input[type="range"]{flex:1;margin:0 12px;accent-color:var(--primary);}
.setting-row input[type="number"]{width:60px;border:1px solid var(--fg40);border-radius:6px;padding:2px 6px;font-family:inherit;font-size:13px;background:transparent;color:var(--fg);}
.setting-row button{background:transparent;border:none;color:var(--primary);font-size:13px;cursor:pointer;font-family:inherit;}

.switch{width:44px;height:24px;border-radius:12px;background:rgba(0,0,0,.15);position:relative;cursor:pointer;transition:background .2s;}
.switch.on{background:var(--primary);}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.switch.on::after{left:22px;}

.grad-upload{display:flex;gap:10px;margin:12px 16px;}
.grad-upload label{flex:1;background:transparent;border:1.5px dashed var(--primary);color:var(--primary);padding:12px;border-radius:10px;text-align:center;font-size:13px;cursor:pointer;font-family:inherit;}
.grad-upload button{flex:1;background:transparent;border:1.5px dashed var(--fg40);color:var(--fg60);padding:12px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;}

/* ============ 底部导航 ============ */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.06);padding:8px 12px;padding-bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;z-index:100;}
nav button{flex:1;background:transparent;border:none;color:var(--fg40);font-size:12px;padding:8px 14px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:all .2s;}
nav button .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;}
nav button.active .ic{background:var(--primary);color:#fff;}
nav button.active{color:var(--primary);font-weight:600;}

/* ============ 提示 ============ */
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ 隐藏 class ============ */
.hidden{display:none !important;}
</style>
</head>
<body data-theme="classic">

<div id="bg"><div id="bg-inner"></div></div>
<div id="bg-overlay"></div>

<header>
  <h1>🍅 番茄Todo</h1>
  <div class="today-stat">
    <div><b id="today-work">0</b>今日番茄</div>
    <div><b id="today-done">0</b>今日完成</div>
  </div>
</header>

<main>

<!-- ==================== HOME ==================== -->
<section id="view-home">
  <div class="timer-card">
    <div class="tabs">
      <button data-phase="work" class="active">专注</button>
      <button data-phase="shortBreak">短休息</button>
      <button data-phase="longBreak">长休息</button>
    </div>
    <div class="timer-wrap">
      <svg width="260" height="260">
        <circle cx="130" cy="130" r="110" stroke="rgba(0,0,0,.1)" stroke-width="8" fill="none"/>
        <circle id="progress" cx="130" cy="130" r="110" stroke="#FF6B6B" stroke-width="8" fill="none"
                stroke-linecap="round" stroke-dasharray="691" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-center">
        <div class="timer-time" id="timer-time">25:00</div>
        <div class="timer-label" id="timer-label">专注中</div>
      </div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn ghost sm" id="btn-reset">重置</button>
      <button class="ctrl-btn primary" id="btn-main">开始</button>
      <button class="ctrl-btn ghost sm" id="btn-skip">跳过</button>
    </div>
  </div>

  <div class="section-title">
    我的任务
    <div class="tab-group">
      <button id="tab-active" class="active">全部</button>
      <button id="tab-done">已完成</button>
    </div>
  </div>

  <div class="task-input">
    <input type="text" id="new-task" placeholder="添加新任务...">
    <div class="row">
      <span class="chip" data-p="high">高</span>
      <span class="chip sel" data-p="medium">中</span>
      <span class="chip" data-p="low">低</span>
      <input type="number" id="new-pomo" value="1" min="1" max="8" style="width:48px;border:1px solid var(--fg40);border-radius:6px;padding:2px 6px;background:transparent;color:var(--fg);font-family:inherit;font-size:12px;">
      <button class="add-btn" id="btn-add">添加</button>
    </div>
  </div>

  <div id="task-list"></div>
  <div id="task-empty" class="empty-hint hidden">还没有任务,添加一个吧 ✨</div>
</section>

<!-- ==================== STATS ==================== -->
<section id="view-stats" class="hidden">
  <div class="stat-cards">
    <div class="stat-card"><div class="label">今日</div><div class="value" id="s-today">0</div><div class="unit">个</div></div>
    <div class="stat-card"><div class="label">本周</div><div class="value" id="s-week">0</div><div class="unit">个</div></div>
    <div class="stat-card"><div class="label">本月</div><div class="value" id="s-month">0</div><div class="unit">个</div></div>
    <div class="stat-card"><div class="label">累计</div><div class="value" id="s-total">0</div><div class="unit">个</div></div>
  </div>

  <div class="chart-card">
    <h3>本周每日番茄数</h3>
    <div class="bar-chart" id="week-chart"></div>
  </div>

  <div class="chart-card">
    <h3>时间分配(分钟)</h3>
    <div class="pie-wrap">
      <svg width="140" height="140" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="24"/>
        <g id="pie-slices"></g>
        <circle cx="50" cy="50" r="28" fill="white" fill-opacity=".3"/>
      </svg>
      <div class="legend" id="pie-legend"></div>
    </div>
  </div>

  <div class="chart-card">
    <h3>近 12 周番茄热力图</h3>
    <div style="overflow-x:auto;">
      <div class="heatmap" id="heatmap" style="min-width:300px;"></div>
    </div>
  </div>
</section>

<!-- ==================== SETTINGS ==================== -->
<section id="view-settings" class="hidden">
  <div class="section"><h2>🎨 主题(全部免费)</h2>
    <div class="theme-grid" id="theme-grid"></div>
  </div>

  <div class="section"><h2>🖼 预设渐变背景</h2>
    <div class="grad-grid" id="grad-grid"></div>
  </div>

  <div class="grad-upload">
    <label><input type="file" id="bg-upload" accept="image/*" style="display:none;">从相册选图</label>
    <button id="bg-clear">清除自定义</button>
  </div>

  <div class="setting-row">
    <label>背景遮罩透明度</label>
    <input type="range" id="bg-opacity" min="0" max="100" value="55">
    <span class="val" id="bg-opacity-lbl">55%</span>
  </div>

  <div class="section"><h2>⏱ 计时时长(分钟)</h2>
    <div class="setting-row"><label>专注时长</label><input type="number" id="s-work" min="5" max="90"><span class="val">分钟</span></div>
    <div class="setting-row"><label>短休息</label><input type="number" id="s-short" min="1" max="20"><span class="val">分钟</span></div>
    <div class="setting-row"><label>长休息</label><input type="number" id="s-long" min="5" max="45"><span class="val">分钟</span></div>
    <div class="setting-row"><label>每 N 个番茄后长休息</label><input type="number" id="s-lbi" min="2" max="8" style="width:40px;">个</div>
  </div>

  <div class="section"><h2>🔔 提醒方式</h2>
    <div class="setting-row"><label>完成时震动</label><div class="switch" id="sw-vibrate"></div></div>
    <div class="setting-row"><label>自动开始下一个番茄</label><div class="switch" id="sw-auto"></div></div>
    <div class="setting-row"><label>完成提示音</label><span class="val" id="s-sound">bell</span></div>
  </div>

  <div class="section"><h2>💾 数据</h2>
    <div class="setting-row"><label>导出数据(JSON)</label><button id="btn-export">导出</button></div>
    <div class="setting-row"><label>导入数据</label><button id="btn-import">导入</button></div>
    <div class="setting-row"><label>清除全部数据</label><button id="btn-clear" style="color:#FF6B6B;">清除</button></div>
  </div>
  <div style="height:80px;"></div>
</section>

</main>

<nav>
  <button data-view="home" class="active"><span class="ic">🍅</span>专注</button>
  <button data-view="stats"><span class="ic">📊</span>统计</button>
  <button data-view="settings"><span class="ic">⚙️</span>设置</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
 *  番茄Todo PWA - 全部逻辑在此单文件中,无外部依赖
 * ========================================================================== */

/* -------------------- 存储层 -------------------- */
const DB = {
  kSettings: 'tt_settings',
  kTasks: 'tt_tasks',
  kRecords: 'tt_records',
  kCompletedCount: 'tt_completed_count',

  get(k, def){ try{const s=localStorage.getItem(k); return s?JSON.parse(s):def;}catch(e){return def;} },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); },
  inc(k, d=1){ const v=(this.get(k,0)||0)+d; this.set(k,v); return v; },
};

/* -------------------- 主题定义 -------------------- */
const THEMES = [
  {name:'番茄经典',  primary:'#FF6B6B', accent:'#FF8E53', bg1:'#FFF5F5', bg2:'#FFE0E0', cls:'classic', tp:'#FF6B6B', ta:'#FF8E53'},
  {name:'薄荷清新',  primary:'#6BCB9D', accent:'#4ECDC4', bg1:'#F0FFF5', bg2:'#D8F5E0', cls:'mint',    tp:'#6BCB9D', ta:'#4ECDC4'},
  {name:'深海蓝调',  primary:'#4A90E2', accent:'#90CAF9', bg1:'#F0F7FF', bg2:'#D0E4FA', cls:'ocean',   tp:'#4A90E2', ta:'#90CAF9'},
  {name:'晨曦橙光',  primary:'#FFA726', accent:'#FF7043', bg1:'#FFFBF2', bg2:'#FFE0B2', cls:'sun',     tp:'#FFA726', ta:'#FF7043'},
  {name:'薰衣草紫',  primary:'#9575CD', accent:'#D1C4E9', bg1:'#F8F5FF', bg2:'#EDE4F8', cls:'lavender',tp:'#9575CD', ta:'#D1C4E9'},
  {name:'暗夜模式',  primary:'#81D4FA', accent:'#4FC3F7', bg1:'#121212', bg2:'#1E1E1E', cls:'dark',    tp:'#81D4FA', ta:'#4FC3F7'},

const GRADS = [
  ['#FF6B6B','#FF8E53'], ['#6BCB9D','#4ECDC4'], ['#4A90E2','#90CAF9'],
  ['#FFA726','#FF7043'], ['#9575CD','#D1C4E9'], ['#81D4FA','#263238'],
  ['#FF00FF','#00FFFF'], ['#5D6D7E','#2C3E50'], ['#F093FB','#F5576C'],

/* -------------------- 默认设置 -------------------- */
const DEFAULT_SETTINGS = {
  workDuration:25, shortBreakDuration:5, longBreakDuration:15, longBreakInterval:4,
  themeIndex:0, bgIndex:null, bgImage:null, bgOpacity:55,
  vibrate:true, autoStart:false, sound:'bell',
};

/* -------------------- 状态 -------------------- */
let S = {...DEFAULT_SETTINGS, ...DB.get(DB.kSettings, {})};
let tasks = DB.get(DB.kTasks, []);
let records = DB.get(DB.kRecords, []);
let phase = 'work';
let timerState = 'idle';
let remaining = S.workDuration * 60;
let completedWork = 0;
let selectedTaskId = null;
let currentPomoSel = 'medium'; // high / medium / low

/* -------------------- 持久化 -------------------- */
function saveAll(){
  DB.set(DB.kSettings, S);
  DB.set(DB.kTasks, tasks);
  DB.set(DB.kRecords, records);
  DB.set(DB.kCompletedCount, completedWork);

/* -------------------- Toast -------------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* -------------------- 应用主题 -------------------- */
function applyTheme(){
  const t = THEMES[S.themeIndex];
  document.documentElement.style.setProperty('--primary', t.primary);
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--bg1', t.bg1);
  document.documentElement.style.setProperty('--bg2', t.bg2);
  if (t.cls === 'dark' || t.cls === 'cyber') {
    document.documentElement.style.setProperty('--card','rgba(30,30,30,.92)');
    document.documentElement.style.setProperty('--fg','#E0E0E0');
    document.documentElement.style.setProperty('--fg60','rgba(224,224,224,.6)');
    document.documentElement.style.setProperty('--fg40','rgba(224,224,224,.4)');
  } else {
    document.documentElement.style.setProperty('--card','rgba(255,255,255,.9)');
    document.documentElement.style.setProperty('--fg','#2D2D2D');
    document.documentElement.style.setProperty('--fg60','rgba(45,45,45,.6)');
    document.documentElement.style.setProperty('--fg40','rgba(45,45,45,.4)');
  }
  // 背景
  const bg = document.getElementById('bg');
  const inner = document.getElementById('bg-inner');
  bg.style.background = '';
  inner.style.background = '';
  inner.style.backgroundImage = 'none';
  if (S.bgImage){
    inner.style.backgroundImage = `url(${S.bgImage})`;
    document.body.setAttribute('data-bg','img');
  } else if (S.bgIndex !== null && S.bgIndex !== undefined){
    const g = GRADS[S.bgIndex];
    document.body.setAttribute('data-bg','grad');
    bg.style.background = `linear-gradient(135deg,${g[0]},${g[1]})`;
  } else {
    document.body.removeAttribute('data-bg');
    bg.style.background = `linear-gradient(135deg,${t.bg1},${t.bg2})`;
  }
  // 遮罩
  document.getElementById('bg-overlay').style.background =
    `rgba(0,0,0,${S.bgOpacity/100})`;

  // 更新进度圈颜色
  document.getElementById('progress').setAttribute('stroke', t.primary);
}

/* -------------------- 计时器 -------------------- */
let timerHandle = null;
function phaseTotal(){
  return (phase==='work'?S.workDuration:phase==='shortBreak'?S.shortBreakDuration:S.longBreakDuration)*60;
}
function phaseLabel(){
  return phase==='work'?'专注中':phase==='shortBreak'?'短休息':'长休息';
}
function fmt(s){
  const m=Math.floor(s/60), ss=s%60;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
function updateTimerUI(){
  document.getElementById('timer-time').textContent = fmt(Math.max(0,remaining));
  document.getElementById('timer-label').textContent = phaseLabel();
  const total = phaseTotal();
  const circ = 2 * Math.PI * 110;
  const offset = circ * (1 - Math.max(0,remaining)/total);
  document.getElementById('progress').setAttribute('stroke-dashoffset', offset);
  // 控制按钮文字
  const btn = document.getElementById('btn-main');
  btn.textContent = timerState==='running'?'暂停':timerState==='paused'?'继续':'开始';
}

function tick(){
  remaining--;
  if (remaining < 0){
    phaseComplete();
    return;
  }
  updateTimerUI();
}

function start(){
  if (timerState==='running') return;
  if (remaining <= 0) remaining = phaseTotal();
  if (timerState==='idle') remaining = phaseTotal();
  timerState = 'running';
  timerHandle = setInterval(tick, 1000);
  updateTimerUI();
}
function pause(){
  clearInterval(timerHandle); timerHandle=null;
  timerState='paused'; updateTimerUI();
}
function reset(){
  clearInterval(timerHandle); timerHandle=null;
  timerState='idle'; remaining = phaseTotal(); updateTimerUI();
}
function skip(){ phaseComplete(); }

function phaseComplete(){
  clearInterval(timerHandle); timerHandle=null;
  timerState = 'idle';

  // 记录
  const rec = {
    phase: phase,
    mins: phaseTotal()/60,
    at: Date.now(),
    taskId: selectedTaskId,
  };
  records.push(rec);
  if (phase === 'work'){
    completedWork++;
    // 关联任务的番茄数+1
    if (selectedTaskId){
      const t = tasks.find(x=>x.id===selectedTaskId);
      if (t) t.completedPomodoros = (t.completedPomodoros||0)+1;
    }
    // 震动
    if (S.vibrate && navigator.vibrate){
      try{ navigator.vibrate([100,50,100]); }catch(e){}
    }
  }
  saveAll();

  // 提示音
  beepComplete();

  // 下一阶段
  if (phase==='work'){
    phase = (completedWork % S.longBreakInterval === 0) ? 'longBreak' : 'shortBreak';
  } else {
    phase = 'work';
  }
  remaining = phaseTotal();
  updateTimerUI();
  renderStats();
  renderHomeStats();

  toast(`🎉 ${phaseLabel()} 完成!下一阶段:${phase==='work'?'专注':'休息'}`);

  if (S.autoStart) start();
}

function setPhase(p){
  phase = p;
  reset();
}

/* -------------------- 声音 (WebAudio,内置生成,零文件) -------------------- */
let audioCtx = null;
function beepComplete(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = audioCtx;
    const notes = S.sound==='none'?[] : (S.sound==='chime'?[880,1175,1568]: S.sound==='ding'?[659,988]: [523,659,784]);
    let t = ctx.currentTime;
    notes.forEach((f,i)=>{
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.35);
      t += 0.25;
    });
  }catch(e){}
}

/* -------------------- 任务管理 -------------------- */
function uuid(){
  return 't_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}
function renderTasks(){
  const list = document.getElementById('task-list');
  const tabDone = document.getElementById('tab-done').classList.contains('active');
  const arr = tasks.filter(t=>tabDone?t.isCompleted:!t.isCompleted);
  arr.sort((a,b)=>{
    const po={high:0,medium:1,low:2};
    if (!tabDone){
      const d = (po[a.priority]??1)-(po[b.priority]??1);
      if (d) return d;
      return b.createdAt - a.createdAt;
    }
    return (b.completedAt||0)-(a.completedAt||0);
  });

  document.getElementById('task-empty').classList.toggle('hidden', arr.length>0);
  list.innerHTML = arr.map(t=>`
    <div class="task-item ${t.isCompleted?'done':''} ${selectedTaskId===t.id?'selected':''}" data-id="${t.id}">
      <div class="check ${t.isCompleted?'done':''}" data-act="check">${t.isCompleted?'✓':''}</div>
      <div class="content">
        <div class="title">${escapeHTML(t.title)}</div>
        <div class="meta">
          <span class="pri ${t.priority}">${t.priority==='high'?'高':t.priority==='medium'?'中':'低'}</span>
          <span class="pomo">🍅 ${t.completedPomodoros||0}/${t.estimatedPomodoros||1}</span>
        </div>
      </div>
      <div class="act">
        <button data-act="sel" class="${selectedTaskId===t.id?'sel':''}" title="关联番茄">${selectedTaskId===t.id?'★':'☆'}</button>
        <button data-act="del" title="删除">🗑</button>
      </div>
    </div>
  `).join('');
  renderHomeStats();
}

function escapeHTML(s){
  return String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
}

function addTask(){
  const inp = document.getElementById('new-task');
  const title = inp.value.trim();
  if (!title) return;
  const pomo = Math.max(1, parseInt(document.getElementById('new-pomo').value)||1);
  tasks.unshift({
    id: uuid(),
    title, priority: currentPomoSel,
    estimatedPomodoros: pomo,
    completedPomodoros: 0,
    isCompleted: false,
    createdAt: Date.now(),
    completedAt: null,
  });
  saveAll();
  inp.value='';
  renderTasks();
}

/* -------------------- 事件委托 -------------------- */
document.getElementById('task-list').addEventListener('click', e=>{
  const item = e.target.closest('.task-item');
  if (!item) return;
  const id = item.dataset.id;
  const act = e.target.dataset.act || (e.target.closest('[data-act]')?.dataset.act);
  if (!act) return;
  if (act==='check'){
    const t = tasks.find(x=>x.id===id);
    t.isCompleted = !t.isCompleted;
    t.completedAt = t.isCompleted ? Date.now() : null;
    saveAll(); renderTasks();
  } else if (act==='sel'){
    selectedTaskId = selectedTaskId===id ? null : id;
    renderTasks();
  } else if (act==='del'){
    if (confirm('确定删除这个任务吗?')){
      tasks = tasks.filter(x=>x.id!==id);
      if (selectedTaskId===id) selectedTaskId=null;
      saveAll(); renderTasks();
    }
  }
});

document.getElementById('btn-add').onclick = addTask;
document.getElementById('new-task').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });
document.querySelectorAll('.task-input .chip').forEach(c=>{

document.getElementById('tab-done').onclick = ()=>{

document.querySelectorAll('.tabs button').forEach(b=>{

/* -------------------- 页面切换 -------------------- */
document.querySelectorAll('nav button').forEach(b=>{

/* -------------------- 统计渲染 -------------------- */
function today(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function isSameDay(at, key){
  const d=new Date(at);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`===key;
}
function renderHomeStats(){
  const k = today();
  const tw = records.filter(r=>r.phase==='work' && isSameDay(r.at, k)).length;
  document.getElementById('today-work').textContent = tw;
  document.getElementById('today-done').textContent =
    tasks.filter(t=>t.isCompleted && isSameDay(t.completedAt||0, k)).length;
}

function renderStats(){
  const k = today();
  const tw = records.filter(r=>r.phase==='work' && isSameDay(r.at, k)).length;
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate()-(now.getDay()||7)+1); monday.setHours(0,0,0,0);
  const weekWork = records.filter(r=>r.phase==='work' && r.at >= monday.getTime()).length;
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthWork = records.filter(r=>r.phase==='work' && r.at >= monthStart.getTime()).length;
  const totalWork = records.filter(r=>r.phase==='work').length;

  document.getElementById('s-today').textContent = tw;
  document.getElementById('s-week').textContent = weekWork;
  document.getElementById('s-month').textContent = monthWork;
  document.getElementById('s-total').textContent = totalWork;

  // 周柱状图
  const weekDays = ['一','二','三','四','五','六','日'];
  const weekData = [];
  for (let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const kk = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    weekData.push(records.filter(r=>r.phase==='work' && isSameDay(r.at, kk)).length);
  }
  const mx = Math.max(1,...weekData);
  const maxH = 120;
  document.getElementById('week-chart').innerHTML = weekData.map((v,i)=>`
    <div class="bar-wrap"><div class="bar" style="height:${v/mx*maxH}px"></div><div class="lbl">${weekDays[i]}</div></div>
  `).join('');

  // 饼图
  const workMin = records.filter(r=>r.phase==='work').reduce((a,r)=>a+(r.mins||0),0);
  const shortMin = records.filter(r=>r.phase==='shortBreak').reduce((a,r)=>a+(r.mins||0),0);
  const longMin = records.filter(r=>r.phase==='longBreak').reduce((a,r)=>a+(r.mins||0),0);
  const pie = [
    {name:'专注', v:workMin, c:'var(--primary)'},
    {name:'短休', v:shortMin, c:'var(--primary)'},
    {name:'长休', v:longMin, c:'var(--accent)'},
  ];
  const totalMin = pie.reduce((a,x)=>a+x.v,0);
  let pieHtml='', acc=0;
  if (totalMin>0){
    pie.forEach(x=>{
      const pct = x.v/totalMin;
      const dash = `${(pct*251.2).toFixed(2)} 251.2`;
      const off = -(acc/totalMin*251.2);
      pieHtml += `<circle cx="50" cy="50" r="40" fill="none" stroke="${x.c}" stroke-width="24" stroke-dasharray="${dash}" stroke-dashoffset="${off.toFixed(2)}"/>`;
      acc += x.v;
    });
  } else {
    pieHtml = `<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="24"/>`;
  }
  document.getElementById('pie-slices').innerHTML = pieHtml;
  document.getElementById('pie-legend').innerHTML = pie.filter(x=>x.v>0).map(x=>
    `<div class="lg"><span class="dot" style="background:${x.c}"></span>${x.name} ${x.v}分</div>`
  ).join('') || '<div class="lg" style="color:rgba(0,0,0,.3)">暂无数据</div>';

  // 热力图 12 周 x 7 天
  const cells = [];
  const todayTs = Date.now();
  const startTs = todayTs - (12*7-1)*86400000;
  for (let w=0; w<12; w++){
    cells.push('<div class="col">');
    for (let d=0; d<7; d++){
      const ts = startTs + (w*7+d)*86400000;
      const kk = new Date(ts);
      const key = `${kk.getFullYear()}-${kk.getMonth()+1}-${kk.getDate()}`;
      const cnt = records.filter(r=>r.phase==='work' && isSameDay(r.at, key)).length;
      const lvl = cnt===0 ? 'l1' : cnt<=2?'l2':cnt<=4?'l3':cnt<=7?'l4':'l5';
      cells.push(`<div class="cell ${lvl}" title="${key}: ${cnt} 个番茄"></div>`);
    }
    cells.push('</div>');
  }
  document.getElementById('heatmap').innerHTML = cells.join('');
}

/* -------------------- 设置渲染 -------------------- */
function renderSettings(){
  // 主题
  document.getElementById('theme-grid').innerHTML = THEMES.map((t,i)=>
    `<div class="theme-item ${S.themeIndex===i?'sel':''}" data-i="${i}">
      <div class="swatch" style="--tp:${t.tp};--ta:${t.ta};background:linear-gradient(135deg,var(--tp),var(--ta));"></div>
      <div class="name">${t.name}</div>
    </div>`).join('');
  document.querySelectorAll('#theme-grid .theme-item').forEach(el=>{
    el.onclick = ()=>{
      S.themeIndex = +el.dataset.i; saveAll(); applyTheme(); renderSettings();
    };
  });
  // 渐变
  document.getElementById('grad-grid').innerHTML = GRADS.map((g,i)=>
    `<div class="grad-item ${S.bgIndex===i?'sel':''}" style="background:linear-gradient(135deg,${g[0]},${g[1]})" data-i="${i}"></div>`
  ).join('');
  document.querySelectorAll('#grad-grid .grad-item').forEach(el=>{
    el.onclick = ()=>{
      S.bgIndex = +el.dataset.i; S.bgImage=null; saveAll(); applyTheme(); renderSettings();
    };
  });
  // 时长
  document.getElementById('s-work').value = S.workDuration;
  document.getElementById('s-short').value = S.shortBreakDuration;
  document.getElementById('s-long').value = S.longBreakDuration;
  document.getElementById('s-lbi').value = S.longBreakInterval;
  ['s-work','s-short','s-long','s-lbi'].forEach(id=>{
    const el = document.getElementById(id);
    const key = {s_work:'workDuration',s_short:'shortBreakDuration',s_long:'longBreakDuration',s_lbi:'longBreakInterval'}[id];
    el.onchange = ()=>{
      S[key] = Math.max(1, +el.value); saveAll();
      if (timerState==='idle'){ remaining = phaseTotal(); updateTimerUI(); }
    };
  });
  // 透明度
  document.getElementById('bg-opacity').value = S.bgOpacity;
  document.getElementById('bg-opacity-lbl').textContent = S.bgOpacity+'%';
  document.getElementById('bg-opacity').oninput = ()=>{
    S.bgOpacity = +document.getElementById('bg-opacity').value;
    document.getElementById('bg-opacity-lbl').textContent = S.bgOpacity+'%';
    applyTheme();
  };
  // 开关
  document.getElementById('sw-vibrate').classList.toggle('on', S.vibrate);
  document.getElementById('sw-vibrate').onclick = ()=>{ S.vibrate=!S.vibrate; saveAll(); renderSettings(); };
  document.getElementById('sw-auto').classList.toggle('on', S.autoStart);
  document.getElementById('sw-auto').onclick = ()=>{ S.autoStart=!S.autoStart; saveAll(); renderSettings(); };
  // 声音
  document.getElementById('s-sound').textContent = S.sound;
  document.getElementById('s-sound').onclick = ()=>{
    const opts = ['tick','chime','ding','none'];
    const idx = opts.indexOf(S.sound);
    S.sound = opts[(idx+1)%opts.length];
    saveAll(); renderSettings();
    beepComplete();
  };
  // 背景上传
  document.getElementById('bg-upload').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ S.bgImage = r.result; S.bgIndex=null; saveAll(); applyTheme(); renderSettings(); };
    r.readAsDataURL(f);
  };
  document.getElementById('bg-clear').onclick = ()=>{
    S.bgImage = null; S.bgIndex = null; saveAll(); applyTheme(); renderSettings(); toast('已清除自定义背景');
  };
  // 导出/导入/清除
  document.getElementById('btn-export').onclick = ()=>{
    const data = {settings:S, tasks, records, completedWork, exportAt: Date.now()};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tomato-todo-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById('btn-import').onclick = ()=>{
    const i = document.createElement('input');
    i.type='file'; i.accept='application/json';
    i.onchange = ()=>{
      const f = i.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const d = JSON.parse(r.result);
          if (d.settings) S = {...DEFAULT_SETTINGS, ...d.settings};
          if (d.tasks) tasks = d.tasks;
          if (d.records) records = d.records;
          completedWork = d.completedWork || 0;
          saveAll(); applyTheme(); renderTasks(); renderStats(); renderHomeStats(); renderSettings();
          toast('导入成功');
        }catch(e){ toast('导入失败:文件格式错误'); }
      };
      r.readAsText(f);
    };
    i.click();
  };
  document.getElementById('btn-clear').onclick = ()=>{
    if (confirm('确定清除全部数据吗?此操作不可恢复!')){
      localStorage.clear();
      location.reload();
    }
  };
}

/* -------------------- Service Worker -------------------- */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* -------------------- 初始化 -------------------- */
(function init(){
  applyTheme();
  updateTimerUI();
  renderTasks();
  renderHomeStats();

  // 每秒刷新日期统计
  setInterval(()=>renderHomeStats(), 10000);

  // 页面关闭时保存
  window.addEventListener('beforeunload', saveAll);
})();
</script>
</body>
</html>
